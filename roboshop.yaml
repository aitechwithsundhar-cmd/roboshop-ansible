- name: create ec2 and r53 records
  hosts: localhost
  connection: local

  vars:
    sg_id: sg-095a16b494e83f916
    ami_id: ami-0220d79f3f480ecf5
    domain name: techdaws.online
    env: dev
    instances:
      - mongodb
      - catalogue

  tasks:
    - name: create ec2 instance
      amazon.aws.ec2_instance:
        instance_type: t3.micro
        security_group: "{{ sg_id }}"
        image_id: "{{ ami_id }}"
        name: "{{ item }}-{{ env }}"
        tags:
          Project: roboshop
          Component: "{{ item }}"
          environment: "{{ env }}"
          name: "{{ item }}-{{ env }}"
      loop: "{{ instances }}"
      register: ec2_instance

    - name: print the output
      ansible.builtin.debug:
        msg: "{{ ec2_instance }}"
      
    - name: create r53 records
      amazon.aws.route53:
        state: present 
        zone: "{{ techdaws.online }}"
        record: "{{ item.item}}-{{env}}.{{ domain_name}}"
        type: a
        ttl: 1
        value: "{{ item.instance[0].private_ip_address }}"
        wait: true 
      loop: "{{ ec2_output.results }}"

