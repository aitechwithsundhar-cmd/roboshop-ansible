# ansible-playbook -i locolhost, -e 'instances=["mongodb", "catalogue", "redis", "user", "cart", "mysql", "shipping", "rabbitmq", "payment", "frontend"]' roboshop.yaml

- name: Create or Delete EC2 instances and Route53 records
  hosts: all
  connection: local
  gather_facts: no

  vars:
    sg_id: sg-095a16b494e83f916
    ami_id: ami-0220d79f3f480ecf5
    domain_name: techdaws.online
    env: dev
    action: create

    instances:
      - mongodb
      - catalogue
      - redis
      - user
      - cart
      - mysql
      - shipping
      - rabbitmq
      - payment
      - frontend

  tasks:

    - name: Create EC2 instances
      amazon.aws.ec2_instance:
        name: "{{ item }}-{{ env }}"
        instance_type: t3.micro
        security_group: "{{ sg_id }}"
        image_id: "{{ ami_id }}"
        wait: yes
        tags:
          Project: roboshop
          Component: "{{ item }}"
          Environment: "{{ env }}"
      loop: "{{ instances }}"
      register: ec2_output
      when: action == "create"

    - name: Create Route53 records
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ item.item }}-{{ env }}.{{ domain_name }}"
        type: A
        ttl: 1
        value: "{{ item.instances[0].private_ip_address }}"
        wait: true
      loop: "{{ ec2_output.results }}"
      when: action == "create"

    - name: Create frontend public DNS record
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "roboshop-{{ env }}.{{ domain_name }}"
        type: A
        ttl: 1
        value: "{{ item.instances[0].private_ip_address }}"
        wait: true
      loop: "{{ ec2_output.results }}"
      when:
        - item.item == "frontend"
        - action == "create"

    - name: Delete EC2 instances
      amazon.aws.ec2_instance:
        name: "{{ item }}-{{ env }}"
        state: absent
        wait: no
      loop: "{{ instances }}"
      when: action == "delete"

    - name: Delete Route53 records
      amazon.aws.route53:
        state: absent
        zone: "{{ domain_name }}"
        record: "{{ item }}-{{ env }}.{{ domain_name }}"
        type: A
      loop: "{{ instances }}"
      when: action == "delete"

    - name: Delete frontend DNS
      amazon.aws.route53:
        state: absent
        zone: "{{ domain_name }}"
        record: "roboshop-{{ env }}.{{ domain_name }}"
        type: A
      when: action == "delete"