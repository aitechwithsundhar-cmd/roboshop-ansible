- name: Configure Catalogue Service
  hosts: catalogue
  become: yes

  vars:
    MONGODB_HOST: "{{ groups['mongodb'][0] }}"

  tasks:

    - name: Enable NodeJS 20
      ansible.builtin.command: dnf module enable nodejs:20 -y

    - name: Install NodeJS
      ansible.builtin.dnf:
        name: nodejs
        state: present

    - name: Create roboshop user
      ansible.builtin.user:
        name: roboshop
        system: true
        home: /app
        shell: /sbin/nologin

    - name: Remove old app directory
      ansible.builtin.file:
        path: /app
        state: absent

    - name: Create app directory
      ansible.builtin.file:
        path: /app
        state: directory

    - name: Remove old zip
      ansible.builtin.file:
        path: /tmp/catalogue.zip
        state: absent

    - name: Download catalogue
      ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip
        dest: /tmp/catalogue.zip

    - name: Extract catalogue
      ansible.builtin.unarchive:
        src: /tmp/catalogue.zip
        dest: /app
        remote_src: yes

    - name: Install dependencies
      ansible.builtin.command: npm install
      args:
        chdir: /app

    - name: Copy service file
      ansible.builtin.template:
        src: catalogue.service
        dest: /etc/systemd/system/catalogue.service

    - name: Copy mongo repo
      ansible.builtin.copy:
        src: mongo.repo
        dest: /etc/yum.repos.d/mongo.repo

    - name: Install Mongo client
      ansible.builtin.dnf:
        name: mongodb-mongosh
        state: present

    - name: Load catalogue schema
      ansible.builtin.shell: mongosh --host "{{ MONGODB_HOST }}" </app/db/master-data.js

    - name: Reload systemd
      ansible.builtin.command: systemctl daemon-reload

    - name: Start catalogue service
      ansible.builtin.service:
        name: catalogue
        state: restarted
        enabled: yes