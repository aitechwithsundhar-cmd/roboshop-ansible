- name: Configure Catalogue Service
  hosts: catalogue
  become: yes

  vars:
    MONGODB_HOST: "{{ groups['mongodb'][0] }}"

  tasks:
    - name: Enable NodeJS 20
      ansible.builtin.command: dnf module enable nodejs:20 -y

    - name: Install NodeJS
      ansible.builtin.dnf:
        name: nodejs
        state: present

    - name: Create roboshop system user
      ansible.builtin.user:
        name: roboshop
        system: true
        home: /app
        shell: /sbin/nologin
        comment: "Roboshop system user"

    - name: delete app directory
      ansible.builtin.file:
        path: /app
        state: absent

    - name: Create application directory
      ansible.builtin.file:
        path: /app
        state: directory

    - name: delete catalogue zip file
      ansible.builtin.file:
        path: /tmp/catalogue.zip
        state: absent 

    - name: Download catalogue application
      ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip
        dest: /tmp/catalogue.zip

    - name: Extract catalogue application
      ansible.builtin.unarchive:
        src: /tmp/catalogue.zip
        dest: /app
        remote_src: yes

    - name: Install NodeJS dependencies
      community.general.npm:
        path: /app

    - name: Copy catalogue service file
      ansible.builtin.template:
        src: catalogue.service.j2
        dest: /etc/systemd/system/catalogue.service

    - name: Copy MongoDB repo file
      ansible.builtin.copy:
        src: mongo.repo
        dest: /etc/yum.repos.d/mongo.repo

    - name: Install MongoDB client
      ansible.builtin.dnf:
        name: mongodb-mongosh
        state: present

    - name: Check if catalogue database exists
      ansible.builtin.command: >
        mongosh --host "{{ MONGODB_HOST }}"
        --quiet --eval 'db.getMongo().getDBNames().indexOf("catalogue")'
      register: catalogue_output

    - name: Print database check result
      ansible.builtin.debug:
        msg: "{{ catalogue_output.stdout }}"

    - name: load the products 
      ansible.builtin.shell: mongosh --host "{{ MONGODB_HOST }}" </app/db/master-data.js
      when: catalogue_output.stdout | int < 0 

    - name: unmask catalogue service 
      ansible.builtin.command: systemctl unmask catalogue 
      ignore_errors: true 

    - name: Reload systemd
      ansible.builtin.command: systemctl daemon-reload

    - name: Start catalogue service
      ansible.builtin.service:
        name: catalogue
        state: started
        enabled: yes