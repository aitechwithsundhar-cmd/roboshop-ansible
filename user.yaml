- name: configure user service
  hosts: user
  become: yes

  tasks:
    - name: disable default nodejs
      ansible.builtin.command: dnf module disable nodejs -y

    - name: enable nodejs 20
      ansible.builtin.command: dnf module enable nodejs:20 -y

    - name: install nodejs
      ansible.builtin.dnf:
        name: nodejs
        state: present

    - name: create system user roboshop
      ansible.builtin.user:
        name: roboshop
        system: yes
        home: /app
        shell: /sbin/nologin
        comment: "roboshop system user"

    - name: remove old application files
      ansible.builtin.file:
        path: /app
        state: absent

    - name: create aap directory 
      ansible.builtin.file:
        path: /app
        state: directory

    - name: delete user zip file
      ansible.builtin.file:
        path: /tmp/user.zip
        state: absent

    - name: download user application
      ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/user-v3.zip
        dest: /tmp/user.zip

    - name: extract user application
      ansible.builtin.unarchive:
        src: /tmp/user.zip
        dest: /app
        remote_src: yes

    - name: install npm dependencies
      community.general.npm:
        path: /app

    - name: copy user service file
      ansible.builtin.template:
        src: user.service
        dest: /etc/systemd/system/user.service

    - name: reload systemd
      ansible.builtin.command: systemctl daemon-reload

    - name: restart user service
      ansible.builtin.service:
        name: user
        state: restarted
        enabled: yes